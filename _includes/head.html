  <!-- Swiper powers the embedded "Approach" image slider (#mainCarousel,
       case-study-template.html) - not the lightbox above, which stays
       Fancybox. Swapped in to fix an unresolved upstream Fancybox
       Carousel bug (fancyapps/ui#529) that blocked page scroll while
       hovering the slider. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12.2.0/swiper-bundle.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/swiper@12.2.0/swiper-bundle.min.js"></script>
  <script>
    Fancybox.bind('[data-fancybox]', {
        Toolbar: false,
      closeButton: "top",
      Image: {
        Panzoom: {
            maxScale: function () {
          return 1;
          },
        },
      },
      Thumbs: {
        Carousel: {
          fill: false,
          center: true
        },
      },
      on: {
        // Keeps #mainCarousel's own Swiper position in sync with
        // whatever slide is currently showing in the lightbox, so
        // closing it doesn't leave the page showing a different image
        // than the one just viewed. Scoped to the carousel-gallery
        // group specifically (slide.$trigger.dataset.fancybox) since
        // this same global Fancybox.bind also covers unrelated
        // galleries (process images, portfolio thumbnails, etc.) on
        // other pages/sections - verified live against a real Fancybox
        // instance: getSlide() returns {$trigger, index, ...}, where
        // $trigger is the real DOM element (not a jQuery object,
        // despite the name) and index is 0-based, matching Swiper's
        // slide order exactly since both read the same DOM.
        'Carousel.change': (fancyboxRef) => {
          const slide = fancyboxRef.getSlide();
          const trigger = slide.$trigger;
          if (trigger && trigger.dataset.fancybox === 'carousel-gallery') {
            const carouselEl = trigger.closest('#mainCarousel');
            if (carouselEl && carouselEl.swiper) {
              carouselEl.swiper.slideTo(slide.index);
            }
          }
        },
      },
    });
  </script>
