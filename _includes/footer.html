<footer>
  <nav aria-label="Footer">
    <div class="footer-nav">
      {% for navigation in site.data.navigation %}
      <a href="{{ navigation.url }}" class="{% if page.url == navigation.url %}active{% endif %}{% if navigation.url == '/work/' %} nested{% endif %}{% if navigation.url == '/contact/' %} contact{% endif %}">{{ navigation.title }}</a>
      {% endfor %}
    </div>
    <div class="subnav">
      {% for subnav in site.data.subnav %}
      <a href="{{ subnav.url }}" target="_blank" rel="noopener">{{ subnav.title }}</a>
      {% endfor %}
    </div>
  </nav>
  <p>© Ryan G. Wilson, 1978‑<span id="copyright"><script>document.getElementById('copyright').appendChild(document.createTextNode(new Date().getFullYear()))</script>
  </span></p>
</footer>
<script>
  // Every data-feather icon sitewide sits right next to its own visible
  // text label (Prev/Next, subnav titles, etc.) - purely decorative,
  // so hide the generated SVGs from assistive tech instead of exposing
  // unlabeled graphics.
  feather.replace({ 'aria-hidden': 'true' })
</script>
